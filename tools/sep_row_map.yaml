# Row map for the Standard Endpoint Protection report template.
#
# Used once, by tools/make_template.py --rows, to turn a finished report into
# a template that keeps every row exactly as the analyst laid it out (wording,
# bold, merged cells, heading styles). For each data row listed here the
# Deployed cell becomes {{=key}} and the Status cell {{?key}}; rows sharing one
# Status cell get {{?key1|key2}} (the worst status is shown).
#
# Row numbers count from 0 = the header row of that table.
# `recommended:` replaces the Trend Recommended cell text (for client-specific
# values); {{m.metric}} is filled from the agent list at render time.

server:            # "Apex One Health Check Overview" table
  2: license.expiry
  3: {key: inventory.deployed_agents, recommended: "Purchased Seat count - {{m.license_seats}}"}
