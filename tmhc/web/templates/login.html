{% extends "base.html" %}{% block body %}<div class="card login"><h1>Sign in</h1>
{% if not configured %}<p class="msg err">No login has been created yet. On the server run:<br><code>python -m tmhc web --set-password &lt;name&gt;</code></p>{% endif %}
{% if error %}<p class="msg err">{{ error }}</p>{% endif %}
<form method="post" action="/login"><p><label>User name</label><input type="text" name="username" autocomplete="username" autofocus required></p>
<p><label>Password</label><input type="password" name="password" autocomplete="current-password" required></p>
<button class="btn">Sign in</button></form></div>{% endblock %}
