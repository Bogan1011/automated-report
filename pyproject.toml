[project]
name = "tmhc"
version = "0.1.0"
description = "Trend Micro health-check report generator"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1", "PyYAML>=6.0", "openpyxl>=3.1", "anthropic>=0.40"]

[project.scripts]
tmhc = "tmhc.cli:main"

[tool.setuptools.packages.find]
include = ["tmhc*"]

[tool.setuptools.package-data]
tmhc = ["rules/*.yaml", "render/assets/*.png", "render/templates/*.docx"]
